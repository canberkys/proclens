name: ProcLens
options:
  bundleIdPrefix: com.canberkki
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      # Keep the bundle small: strip all symbols, drop dead code (DECISIONS: small binary).
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
packages:
  ProcLensCore:
    path: ProcLensCore
targets:
  ProcLens:
    type: application
    platform: macOS
    sources:
      - path: ProcLens
      - path: ProcLensHelper/com.canberkki.ProcLens.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: ProcLensCore
        product: ProcLensCore
      - target: ProcLensHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.canberkki.ProcLens
        PRODUCT_NAME: ProcLens
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_CFBundleDisplayName: ProcLens
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  # Privileged helper (SMAppService.daemon). Embedded at Contents/MacOS/ProcLensHelper;
  # its launchd plist goes to Contents/Library/LaunchDaemons.
  ProcLensHelper:
    type: tool
    platform: macOS
    sources:
      - path: ProcLensHelper
        excludes: ["*.plist"]
    dependencies:
      - package: ProcLensCore
        product: ProcLensHelperProtocol
    settings:
      base:
        PRODUCT_NAME: ProcLensHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.canberkki.ProcLens.helper
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
  # proclens CLI (Phase 3) ships separately (Homebrew), not embedded: swift build -c release --product proclens
schemes:
  ProcLens:
    build:
      targets:
        ProcLens: all
    run:
      config: Debug
