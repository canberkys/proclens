name: ProcLens
options:
  bundleIdPrefix: com.canberkki
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      # Ad-hoc dev builds: hardened runtime's library validation rejects Sparkle.framework (signed with a different
      # Team ID). Release builds are Developer ID signed by scripts/release.sh, where every component shares one team.
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      # Keep the bundle small: strip all symbols, drop dead code (DECISIONS: small binary).
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
packages:
  ProcLensCore:
    path: ProcLensCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6
targets:
  ProcLens:
    type: application
    platform: macOS
    sources:
      - path: ProcLens
      - path: CHANGELOG.md
        buildPhase: resources
      - path: ProcLensHelper/com.canberkki.ProcLens.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: ProcLensCore
        product: ProcLensCore
      - package: Sparkle
        product: Sparkle
      - target: ProcLensHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
    # Sparkle 2 keys. Merged with the generated Info.plist (GENERATE_INFOPLIST_FILE). The private EdDSA key lives
    # only in the maintainer's login keychain (generate_keys --account proclens); this is the public half.
    info:
      path: ProcLens/Info.plist
      properties:
        SUFeedURL: https://raw.githubusercontent.com/canberkys/proclens/main/appcast.xml
        SUPublicEDKey: YLpPfO4C1ySV1o3+D/ww+GCCY6Dbb83Ma0eBrCHfWSU=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAllowsAutomaticUpdates: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.canberkki.ProcLens
        PRODUCT_NAME: ProcLens
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_CFBundleDisplayName: ProcLens
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "3"
  # Privileged helper (SMAppService.daemon). Embedded at Contents/MacOS/ProcLensHelper;
  # its launchd plist goes to Contents/Library/LaunchDaemons.
  ProcLensHelper:
    type: tool
    platform: macOS
    sources:
      - path: ProcLensHelper
        excludes: ["*.plist"]
    dependencies:
      - package: ProcLensCore
        product: ProcLensHelperProtocol
    settings:
      base:
        PRODUCT_NAME: ProcLensHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.canberkki.ProcLens.helper
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
  # proclens CLI (Phase 3) ships separately (Homebrew), not embedded: swift build -c release --product proclens
schemes:
  ProcLens:
    build:
      targets:
        ProcLens: all
    run:
      config: Debug
